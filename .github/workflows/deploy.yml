name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm finance:test
      - run: pnpm finance:build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - id: dashboard
        run: pnpm e2e:dashboard --grep-invert 'all-period view bounds rendering and preserves balances through 716 chronological steps' --output=test-results-dashboard
        env:
          CI: 1
          VITE_BUDGET_SHEET_ID: synthetic-budget-sheet-2098
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-dashboard
      # Keep the complete journey; isolate its rendering from concurrent browsers.
      - run: pnpm e2e:dashboard --grep 'all-period view bounds rendering and preserves balances through 716 chronological steps' --workers=1 --output=test-results-dashboard-long
        if: ${{ !cancelled() && (steps.dashboard.outcome == 'success' || steps.dashboard.outcome == 'failure') }}
        env:
          CI: 1
          VITE_BUDGET_SHEET_ID: synthetic-budget-sheet-2098
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-dashboard-long
      - run: pnpm exec playwright test e2e/purchase-hierarchy.spec.ts e2e/flows.spec.ts e2e/record-journey.spec.ts e2e/budget.spec.ts e2e/settings-cache.spec.ts e2e/sync-recovery.spec.ts --project=iphone4 --project=iphone12-webkit
        env:
          CI: 1
      - run: pnpm build
        env:
          VITE_BUDGET_SHEET_ID: synthetic-budget-sheet-2098
      - run: pnpm exec playwright test --config playwright.finansman.config.ts
        env:
          CI: 1
      - run: pnpm build
        env:
          VITE_BUDGET_SHEET_ID: ${{ vars.VITE_BUDGET_SHEET_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: pnpm exec playwright test --config playwright.timeline-production.config.ts
        env:
          CI: 1
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: dashboard-test-report
          path: |
            playwright-report
            test-results
            playwright-report-dashboard
            test-results-dashboard
            playwright-report-dashboard-long
            test-results-dashboard-long
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
